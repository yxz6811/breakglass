<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BreakGlass · 液态玻璃顶栏原型</title>
    <link rel="stylesheet" href="./liquid-glass.css">
  </head>
  <body>
    <div class="demo-bg" aria-hidden="true">
      <span class="demo-bg__blob demo-bg__blob--a"></span>
      <span class="demo-bg__blob demo-bg__blob--b"></span>
      <span class="demo-bg__blob demo-bg__blob--c"></span>
      <span class="demo-bg__grid"></span>
    </div>

    <!-- 折射滤镜：液态玻璃的边缘波纹。默认关闭，支持时由 JS 打开。 -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <filter id="lg-refract" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="2" seed="7" result="noise"/>
        <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="18" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>

    <div class="lg-dock" data-liquid-glass>
      <div class="lg-glass" aria-hidden="true"></div>
      <div class="lg-refract" aria-hidden="true"></div>
      <nav class="lg-items" aria-label="演示控制">
        <button class="lg-item" type="button" aria-label="播放视频">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l10-6.5-10-6.5Z"/></svg>
          <span class="lg-tip">播放</span>
        </button>
        <button class="lg-item" type="button" aria-label="定位到目标时间">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          <span class="lg-tip">定位</span>
        </button>
        <button class="lg-item" type="button" data-variant="primary" aria-label="破壁">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"/></svg>
          <span class="lg-tip">破壁 Alt+B</span>
        </button>
        <span class="lg-sep" role="separator" aria-orientation="vertical"></span>
        <button class="lg-item" type="button" data-action="retry" hidden aria-label="重试">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></svg>
          <span class="lg-tip">重试</span>
        </button>
        <button class="lg-item" type="button" data-action="reset" aria-label="重置参数">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>
          <span class="lg-tip">重置</span>
        </button>
        <button class="lg-item" type="button" data-action="fullscreen" aria-label="切换全屏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <span class="lg-tip">全屏</span>
        </button>
        <button class="lg-item" type="button" data-action="exit" aria-label="退出交互">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          <span class="lg-tip">退出 Esc</span>
        </button>
      </nav>
    </div>

    <main class="demo-shell">
      <h1>液态玻璃顶栏 · 圆形玻璃按键</h1>
      <p>把鼠标从左到右滑过顶栏：指针经过的圆形按键会依次放大并抬起，相邻按键被连续带动，离开后平滑回落。键盘 Tab 也能触发同样的放大，并显示焦点环。</p>
      <p>材质由四层叠加：底座模糊、白色染色、顶部镜面条带、跟随指针的柔光；边缘用 <b>inset box-shadow</b> 做出玻璃厚度。支持时叠加 SVG 位移滤镜制造边缘折射。</p>
      <div class="demo-readout" id="readout">把指针移到顶栏上查看实时读数。</div>
    </main>

    <script src="./magnify.js"></script>
    <script src="./liquid-glass.js"></script>
    <script>
      // 只读读数：方便设计评审时确认「逐个放大」的数值
      (function () {
        const readout = document.getElementById('readout');
        const dock = window.BreakGlassUI && window.BreakGlassUI.docks && window.BreakGlassUI.docks[0];
        if (!dock || !readout) return;
        let raf = null;
        function paint() {
          raf = null;
          const state = dock.getState();
          const scales = state.scales.map((value, index) =>
            '<b>' + dock.items[index].getAttribute('aria-label') + '</b> ' + value.toFixed(2) + 'x').join(' · ');
          readout.textContent = '指针 x = ' + (Number.isFinite(state.pointerX) ? state.pointerX.toFixed(0) : '—') + ' px ｜ ' + scales;
        }
        setInterval(() => { if (raf === null) raf = window.requestAnimationFrame(paint); }, 60);
      })();
    </script>
  </body>
</html>
