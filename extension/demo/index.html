<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BreakGlass · 原位抛物线演示</title>
    <link rel="stylesheet" href="../src/ui/theme.css">
    <link rel="stylesheet" href="../src/ui/dock.css">
    <link rel="stylesheet" href="./demo.css">
    <script defer src="../src/curve/validate.js"></script>
    <script defer src="../src/curve/evaluate.js"></script>
    <script defer src="../src/geometry/content-rect.js"></script>
    <script defer src="../src/geometry/alignment.js"></script>
    <script defer src="../src/geometry/figures.js"></script>
    <script defer src="../src/session/session.js"></script>
    <script defer src="../src/attempt/simulator.js"></script>
    <script defer src="../src/session/wake.js"></script>
    <script defer src="../src/telemetry/latency.js"></script>
    <script defer src="../src/ui/magnify.js"></script>
    <script defer src="../src/ui/liquid-glass.js"></script>
    <script defer src="../src/preset/load.js"></script>
    <script defer src="../src/preset/place-in-frame.js"></script>
    <script defer src="../src/lesson/reading.js"></script>
    <script defer src="../src/lesson/ask.js"></script>
    <script defer src="../src/tutor/numbers.js"></script>
    <script defer src="../src/tutor/figures.js"></script>
    <script defer src="../src/tutor/parse.js"></script>
    <script defer src="../src/tutor/ask.js"></script>
    <script defer src="../src/page/main.js"></script>
  </head>
  <body>
    <!-- 液态玻璃的边缘折射滤镜：支持 backdrop-filter: url() 时才由脚本启用 -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <filter id="lg-refract" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="2" seed="7" result="noise"/>
        <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="18" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>

    <!-- 液态玻璃顶栏：圆形玻璃按键 + 来源芯片 -->
    <button class="dock-reveal" type="button" data-dock-reveal="demo-toolbar" aria-controls="demo-toolbar" aria-expanded="false">显示工具栏</button>
    <div class="lg-dock" id="demo-toolbar" data-liquid-glass>
      <div class="lg-glass" aria-hidden="true"></div>
      <div class="lg-refract" aria-hidden="true"></div>
      <nav class="lg-items" aria-label="演示控制">
        <button class="lg-item" type="button" id="play-toggle" aria-label="播放视频">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l10-6.5-10-6.5Z"/></svg>
          <span class="lg-tip">播放</span>
        </button>
        <button class="lg-item" type="button" id="jump-target" aria-label="定位到目标时间">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          <span class="lg-tip">定位到第 6 秒</span>
        </button>
        <button class="lg-item" type="button" id="wake-button" data-variant="primary" disabled aria-label="破壁" aria-keyshortcuts="Alt+B" aria-describedby="wake-reason">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"/></svg>
          <span class="lg-tip">破壁 Alt+B</span>
        </button>
        <span class="lg-sep" role="separator" aria-orientation="vertical"></span>
        <button class="lg-item" type="button" id="cancel-button" hidden disabled aria-label="取消等待">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          <span class="lg-tip">取消等待</span>
        </button>
        <button class="lg-item" type="button" id="retry-button" hidden disabled aria-label="重试">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></svg>
          <span class="lg-tip">重试</span>
        </button>
        <button class="lg-item" type="button" id="reset-button" disabled aria-label="重置参数" aria-describedby="reset-reason">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>
          <span class="lg-tip">重置</span>
        </button>
        <button class="lg-item" type="button" id="fullscreen-button" aria-label="切换全屏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <span class="lg-tip">全屏</span>
        </button>
        <button class="lg-item" type="button" id="exit-button" disabled aria-label="退出交互" aria-keyshortcuts="Escape">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          <span class="lg-tip">退出 Esc</span>
        </button>
        <span class="status-chip" id="source-label">等待素材</span>
      </nav>
    </div>

    <main class="app-shell">
      <nav class="workspace-nav" aria-label="工作台切换">
        <a href="./index.html" aria-current="page">曲线演示</a>
        <a href="./geometry.html">几何实验</a>
      </nav>
      <header class="app-header">
        <div>
          <p class="eyebrow">BREAKGLASS · 曲线实验</p>
          <h1>让视频里的抛物线可以被调节</h1>
          <p class="lede">在暂停的画面上，把一条抛物线调节出来。</p>
        </div>
      </header>

      <section class="workspace" aria-label="抛物线演示工作台">
        <div class="video-column">
          <div class="video-stage" id="video-stage">
            <video id="demo-video" data-video-id="fixture-parabola" preload="metadata" controls playsinline></video>
            <div class="stage-banner" id="stage-banner" role="status" aria-live="polite" hidden>
              <span class="stage-banner__mark" aria-hidden="true"></span>
              <div>
                <p class="stage-banner__title" id="stage-banner-title"></p>
                <p class="stage-banner__detail" id="stage-banner-detail"></p>
              </div>
            </div>
            <div class="asset-empty" id="asset-empty">
              <div class="stage-actions">
                <button type="button" class="stage-pick" id="pick-video">选择视频</button>
                <button type="button" class="stage-pick stage-pick--ghost" id="preset-video">选择预设</button>
              </div>
              <p>自己的文件留在这台浏览器里。选择预设会播放包内的 9 秒示例片。</p>
            </div>
          </div>
          <div class="transport" aria-label="视频控制">
            <p class="target-readout" id="target-time-readout">停在第 6 秒</p>
            <label id="target-time-field" hidden>目标时间（秒） <input id="target-time" type="number" min="0" step="0.1" value="6"></label>
            <span id="time-label">当前时间：—</span>
            <div class="waiting-bar" id="waiting-bar" role="status" aria-live="polite" aria-busy="true" hidden>
              <span class="waiting-bar__spinner" aria-hidden="true"></span>
              <span class="waiting-bar__text">正在等待外部结果…</span>
              <span class="waiting-bar__track" aria-hidden="true"><span class="waiting-bar__fill" id="waiting-progress"></span></span>
            </div>
            <div class="stage-actions stage-actions--bar">
              <label class="stage-pick stage-pick--ghost">选择视频
                <input id="local-video" type="file" accept="video/*">
              </label>
              <button type="button" class="stage-pick stage-pick--ghost" data-choose-preset>选择预设</button>
            </div>
            <div class="lesson-row">
              <p id="lesson-status" role="status" aria-live="polite"></p>
              <label>阅读地址
                <input id="lesson-endpoint" type="url" inputmode="url" autocomplete="off" placeholder="填上才开始看这支片子">
              </label>
              <label>课程说明
                <textarea id="lesson-note" rows="2"></textarea>
              </label>
              <button type="button" id="lesson-next" disabled aria-label="下一个">下一个</button>
              <button type="button" id="lesson-cancel" hidden aria-label="取消阅读">取消阅读</button>
            </div>
          </div>
        </div>

        <aside class="control-panel" aria-label="交互控制">
          <p class="panel-kicker">INTERACTION</p>
          <h2 id="figure-title">抛物线参数</h2>
          <div class="figure-picker">
            <label for="figure-kind">当前图形</label>
            <select id="figure-kind" disabled aria-describedby="figure-note">
              <option value="parabola">抛物线</option>
              <option value="line">直线</option>
              <option value="circle">圆</option>
              <option value="sine">正弦</option>
            </select>
          </div>
          <p id="figure-note" class="source-note">破壁后可切换图形。新图形由本地公式绘制。</p>
          <p id="figure-formula" class="figure-formula" hidden></p>
          <p id="state-label" role="status" aria-live="polite">先选择一个视频。文件留在这台浏览器里。</p>
          <!-- 禁用原因：视觉隐藏，只在对应按钮不可用时填字，供读屏说明为什么不能点。 -->
          <p class="sr-only" id="wake-reason"></p>
          <p class="sr-only" id="reset-reason"></p>
          <div id="parabola-parameters">
          <div class="parameter-row">
            <label for="parameter-a">开口宽窄 a</label>
            <output id="parameter-a-value">—</output>
            <input id="parameter-a" type="range" min="0.4" max="1.2" step="0.1" value="1" disabled>
          </div>
          <div class="parameter-row">
            <label for="parameter-h">水平位置 h</label>
            <output id="parameter-h-value">—</output>
            <input id="parameter-h" type="range" min="-2" max="2" step="0.1" value="0" disabled>
          </div>
          <div class="parameter-row">
            <label for="parameter-k">顶点高度 k</label>
            <output id="parameter-k-value">—</output>
            <input id="parameter-k" type="range" min="-2" max="2" step="0.1" value="1" disabled>
          </div>
          </div>
          <div id="local-parameters" hidden>
            <div class="parameter-row" id="figure-row-1">
              <label id="figure-label-1" for="parameter-figure-1">系数 1</label>
              <output id="parameter-figure-1-value" for="parameter-figure-1">—</output>
              <input id="parameter-figure-1" type="range" disabled>
            </div>
            <div class="parameter-row" id="figure-row-2">
              <label id="figure-label-2" for="parameter-figure-2">系数 2</label>
              <output id="parameter-figure-2-value" for="parameter-figure-2">—</output>
              <input id="parameter-figure-2" type="range" disabled>
            </div>
            <div class="parameter-row" id="figure-row-3">
              <label id="figure-label-3" for="parameter-figure-3">系数 3</label>
              <output id="parameter-figure-3-value" for="parameter-figure-3">—</output>
              <input id="parameter-figure-3" type="range" disabled>
            </div>
          </div>
          <p class="source-note" id="source-note">数据来源将在交互出现后显示。</p>
          <section class="tutor" aria-labelledby="tutor-title">
            <h3 class="tutor__title" id="tutor-title">问一问</h3>
            <p class="tutor__hint" id="tutor-hint">先破壁，再问这条曲线。</p>
            <div class="tutor__log" id="tutor-log" role="log" aria-live="polite" aria-label="提问记录" tabindex="0" hidden></div>
            <div class="tutor__examples" id="tutor-examples" role="group" aria-label="可以这样问">
              <button type="button" data-tutor-example="把顶点高度改成 -1" disabled>把顶点高度改成 -1</button>
              <button type="button" data-tutor-example="x 等于 1 时 y 是多少" disabled>x 等于 1 时 y 是多少</button>
              <button type="button" data-tutor-example="如果开口是 0.5，x 等于 2 时 y 是多少" disabled>如果开口是 0.5，x 等于 2 时 y 是多少</button>
            </div>
            <form class="tutor__form" id="tutor-form" autocomplete="off">
              <label class="sr-only" for="tutor-input">向提问区提问</label>
              <input id="tutor-input" type="text" maxlength="120" placeholder="例：把顶点高度改成 -1" aria-describedby="tutor-hint" disabled>
              <button type="submit" id="tutor-send" disabled>问</button>
            </form>
          </section>
        </aside>
      </section>

      <footer class="app-footer">
        <span>Alt+B 破壁 · Esc 退出 · 空格保留给播放器</span>
        <span id="runtime-note" hidden>本地配置加载中…</span>
      </footer>
    </main>
  </body>
</html>
