<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BreakGlass · 原位抛物线演示</title>
    <link rel="stylesheet" href="./demo.css">
    <script defer src="../src/curve/validate.js"></script>
    <script defer src="../src/curve/evaluate.js"></script>
    <script defer src="../src/geometry/content-rect.js"></script>
    <script defer src="../src/geometry/alignment.js"></script>
    <script defer src="../src/session/session.js"></script>
    <script defer src="../src/attempt/simulator.js"></script>
    <script defer src="../src/session/wake.js"></script>
    <script defer src="../src/telemetry/latency.js"></script>
    <script defer src="../src/ui/magnify.js"></script>
    <script defer src="../src/ui/liquid-glass.js"></script>
    <script defer src="../src/preset/load.js"></script>
    <script defer src="../src/page/main.js"></script>
  </head>
  <body>
    <!-- 液态玻璃的边缘折射滤镜：支持 backdrop-filter: url() 时才由脚本启用 -->
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <filter id="lg-refract" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.008 0.02" numOctaves="2" seed="7" result="noise"/>
        <feGaussianBlur in="noise" stdDeviation="2" result="soft"/>
        <feDisplacementMap in="SourceGraphic" in2="soft" scale="18" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>

    <!-- 液态玻璃顶栏：圆形玻璃按键 + 来源芯片 -->
    <div class="lg-dock" data-liquid-glass>
      <div class="lg-glass" aria-hidden="true"></div>
      <div class="lg-refract" aria-hidden="true"></div>
      <nav class="lg-items" aria-label="演示控制">
        <button class="lg-item" type="button" id="play-toggle" aria-label="播放视频">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5.5v13l10-6.5-10-6.5Z"/></svg>
          <span class="lg-tip">播放</span>
        </button>
        <button class="lg-item" type="button" id="jump-target" aria-label="定位到目标时间">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
          <span class="lg-tip">定位目标时间</span>
        </button>
        <button class="lg-item" type="button" id="wake-button" data-variant="primary" disabled aria-label="破壁" aria-keyshortcuts="Alt+B">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5Z"/></svg>
          <span class="lg-tip">破壁 Alt+B</span>
        </button>
        <span class="lg-sep" role="separator" aria-orientation="vertical"></span>
        <button class="lg-item" type="button" id="cancel-button" hidden disabled aria-label="取消等待">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          <span class="lg-tip">取消等待</span>
        </button>
        <button class="lg-item" type="button" id="retry-button" hidden disabled aria-label="重试">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/></svg>
          <span class="lg-tip">重试</span>
        </button>
        <button class="lg-item" type="button" id="reset-button" disabled aria-label="重置参数">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg>
          <span class="lg-tip">重置</span>
        </button>
        <button class="lg-item" type="button" id="fullscreen-button" aria-label="切换全屏">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
          <span class="lg-tip">全屏</span>
        </button>
        <button class="lg-item" type="button" id="exit-button" disabled aria-label="退出交互" aria-keyshortcuts="Escape">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          <span class="lg-tip">退出 Esc</span>
        </button>
        <span class="status-chip" id="source-label">等待素材</span>
      </nav>
    </div>

    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">BREAKGLASS · P0 DEMO</p>
          <h1>让视频里的抛物线可以被调节</h1>
          <p class="lede">当前页面只使用扩展包内的预先准备结果，来源会持续显示。</p>
        </div>
      </header>

      <section class="workspace" aria-label="抛物线演示工作台">
        <div class="video-column">
          <div class="video-stage" id="video-stage">
            <video id="demo-video" data-video-id="fixture-parabola" preload="metadata" controls playsinline></video>
            <div class="asset-empty" id="asset-empty">正式视频素材尚未提供。当前只能验证扩展骨架与夹具逻辑。</div>
          </div>
          <div class="transport" aria-label="视频控制">
            <label>目标时间（秒） <input id="target-time" type="number" min="0" step="0.1" value="12.5"></label>
            <span id="time-label">当前时间：—</span>
            <div class="waiting-bar" id="waiting-bar" role="status" aria-live="polite" aria-busy="true" hidden>
              <span class="waiting-bar__spinner" aria-hidden="true"></span>
              <span class="waiting-bar__text">正在等待外部结果…</span>
              <span class="waiting-bar__track" aria-hidden="true"><span class="waiting-bar__fill" id="waiting-progress"></span></span>
            </div>
          </div>
        </div>

        <aside class="control-panel" aria-label="交互控制">
          <p class="panel-kicker">INTERACTION</p>
          <h2>抛物线参数</h2>
          <p id="state-label" role="status" aria-live="polite">请加载演示视频并暂停在目标时间。</p>
          <div class="parameter-row">
            <label for="parameter-a">开口宽窄 a</label>
            <output id="parameter-a-value">—</output>
            <input id="parameter-a" type="range" min="0.4" max="1.2" step="0.1" value="0.8" disabled>
          </div>
          <div class="parameter-row">
            <label for="parameter-h">水平位置 h</label>
            <output id="parameter-h-value">—</output>
            <input id="parameter-h" type="range" min="-2" max="2" step="0.1" value="0" disabled>
          </div>
          <div class="parameter-row">
            <label for="parameter-k">顶点高度 k</label>
            <output id="parameter-k-value">—</output>
            <input id="parameter-k" type="range" min="-2" max="2" step="0.1" value="0" disabled>
          </div>
          <p class="source-note" id="source-note">数据来源将在交互出现后显示。</p>
        </aside>
      </section>

      <footer class="app-footer">
        <span>Alt+B 破壁 · Esc 退出 · 空格保留给播放器</span>
        <span id="runtime-note">本地配置加载中…</span>
      </footer>
    </main>
  </body>
</html>
